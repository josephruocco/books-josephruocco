<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

    <title>WoodWork — A Visual Bookshelf</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png">

    <link href="/assets/css/books-unified.css" rel="stylesheet">
  </head>

  <body class="books-page">
    <div class="books-page">

      <!-- Header -->
      <header class="books-masthead">
        <div class="books-masthead-inner">
          <a class="books-site-title" href="/">WoodWork</a>

          <nav class="books-nav" aria-label="Primary">
            <a href="/" class="active">Demo</a>
            <a href="/ios/">iOS</a>
          </nav>
        </div>
      </header>

      <!-- Title card -->
      <section class="books-title-card" aria-labelledby="shelf-page-title">
        <div class="books-title-card-inner">
          <h1 id="shelf-page-title">WoodWork</h1>
          <p>A visual bookshelf of public-domain classics, reshuffled every hour.</p>
          <button type="button" class="shelf-shuffle" id="shuffle">Pull a new handful</button>
        </div>
      </section>

      <main class="books-content" id="main-content">
        <div class="shelf-page">
          <section class="demo-builder" aria-labelledby="demo-builder-title">
            <form class="demo-builder-form" id="add-book-form">
              <label class="demo-field">
                <span id="demo-builder-title">Seacrh by Title or Author</span>
                <input id="book-query-input" name="query" type="text" placeholder="The Master and Margarita or Mikhail Bulgakov" autocomplete="off" required>
              </label>
              <div class="demo-builder-actions">
                <button type="submit" class="demo-builder-submit" id="add-book-submit">Add to shelf</button>
                <button type="button" class="demo-builder-reset" id="clear-added-books" hidden>Clear my added books</button>
              </div>
              <p class="demo-builder-status" id="add-book-status" role="status" aria-live="polite"></p>
            </form>
            <article class="demo-match" id="resolved-book" hidden aria-live="polite">
              <div class="demo-match-cover-wrap">
                <img class="demo-match-cover" id="resolved-book-cover" alt="">
              </div>
              <div class="demo-match-copy">
                <p class="demo-match-message" id="resolved-book-message"></p>
              </div>
            </article>

          <div class="shelf-themes" id="themes" role="group" aria-label="Shelf style">
            <button type="button" data-theme="classic" class="is-on">Classic</button>
            <button type="button" data-theme="oak">Dark Oak</button>
            <button type="button" data-theme="builtin">White Built-In</button>
            <button type="button" data-theme="artsy">Artsy</button>
          </div>

          <div class="shelf-case" id="shelf" data-theme="classic" role="img"
               aria-label="A bookshelf of randomly selected books"></div>

          <div class="shelf-bar">
            <span class="shelf-caption" id="caption">Reshuffles every hour.</span>
          </div>
          <section class="shelf-listing" aria-labelledby="shelf-listing-title">
            <h2 class="shelf-listing-title" id="shelf-listing-title">Shelf List</h2>
            <section class="shelf-list-group" id="added-books-group" hidden aria-labelledby="added-books-title">
              <h3 class="shelf-list-group-title" id="added-books-title">Added by You</h3>
              <div class="shelf-list" id="added-books-list"></div>
            </section>
            <section class="shelf-list-group" aria-labelledby="demo-books-title">
              <h3 class="shelf-list-group-title" id="demo-books-title">Demo Shelf:</h3>
              <div class="shelf-list" id="demo-books-list"></div>
            </section>
          </section>
        </div>
      </main>

    </div>

    <section class="demo-reader" id="demo-reader" aria-labelledby="demo-reader-title" hidden>
      <header class="demo-reader-toolbar">
        <button class="demo-reader-close" id="demo-reader-close" type="button">
          <span aria-hidden="true">&larr;</span> Put back on shelf
        </button>
        <div class="demo-reader-heading">
          <p id="demo-reader-author"></p>
          <h2 id="demo-reader-title">Reading Room</h2>
        </div>
        <div class="demo-reader-actions">
          <span id="demo-reader-status">Full text</span>
          <a class="demo-reader-source" id="demo-reader-source" href="#" target="_blank" rel="noopener">Open source</a>
        </div>
      </header>
      <div class="demo-reader-scroll" id="demo-reader-scroll">
        <p class="demo-reader-loading" id="demo-reader-loading" role="status">Opening the book&hellip;</p>
        <div class="demo-reader-layout" id="demo-reader-layout" hidden>
          <article class="demo-reader-text" id="demo-reader-text"></article>
          <aside class="demo-reader-marginalia" id="demo-reader-marginalia" aria-label="Reading notes"></aside>
        </div>
        <p class="demo-reader-error" id="demo-reader-error" role="alert" hidden></p>
      </div>
    </section>

  /* The web shelf uses the same proportions and materials as the iOS shelf. */
  .shelf-case[data-theme="classic"] {
    --back: linear-gradient(#20180f, #0f0b07);
    --board: linear-gradient(to bottom, #6b4a2d, #4c3320);
    --case: #2a1e13; --edge: rgba(0,0,0,.35); --drop: rgba(0,0,0,.45);
  }
  .shelf-case[data-theme="oak"] {
    --case: #172219; --edge: rgba(0,0,0,.55); --drop: rgba(0,0,0,.6);
    background: #172219 url('/assets/images/woodwork/dark-oak-six.webp') center / 124% 100% no-repeat;
  }
  .shelf-case[data-theme="builtin"] {
    --case: #d9d4c8; --edge: rgba(0,0,0,.22); --drop: rgba(0,0,0,.28);
    background: #d9d4c8 url('/assets/images/woodwork/white-built-in-six.webp') center / 134% 100% no-repeat;
  }
  .shelf-case[data-theme="artsy"] {
    --back:
      repeating-linear-gradient(0deg, rgba(80,66,44,.045) 0 1px, transparent 1px 5px),
      linear-gradient(#f4efe4, #e7decb);
    --board: linear-gradient(to bottom, #cbb188, #b2966b);
    --case: #efe7d7; --edge: rgba(60,50,40,.45); --drop: rgba(90,75,60,.28);
  }

  .shelf-case {
    width: 100%;
    max-width: none;
    /* Six rows at roughly the same visual height as the cover cards. */
    aspect-ratio: 4 / 7;
    position: relative;
    box-sizing: border-box;
    border-radius: 28px;
    overflow: hidden;
    background-color: var(--case);
    box-shadow: 0 10px 30px rgba(0,0,0,.22);
  }

  .shelf-case[data-theme="oak"],
  .shelf-case[data-theme="builtin"] { border-radius: 36px; }

  .shelf-case[data-theme="oak"]::before,
  .shelf-case[data-theme="builtin"]::before {
    display: none;
  }

  .shelf-row {
    position: absolute;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    box-sizing: border-box;
    overflow: hidden;
  }
  .shelf-case[data-theme="classic"] .shelf-row,
  .shelf-case[data-theme="artsy"] .shelf-row { background: var(--back); }
  .shelf-row .board {
    position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
    background: var(--board);
    box-shadow: 0 3px 6px var(--drop);
  }
  .shelf-case[data-theme="oak"] .board,
  .shelf-case[data-theme="builtin"] .board {
    display: none;
  }

  .shelf-themes {
    display: flex; flex-wrap: wrap; gap: .4em;
    margin-bottom: 1em;
  }
  .shelf-themes button {
    font: inherit; font-size: .82em;
    padding: .38em .85em;
    border: 1px solid rgba(0,0,0,.25); border-radius: 999px;
    background: none; color: inherit; cursor: pointer;
  }
  .shelf-themes button.is-on { background: #222; color: #fff; border-color: #222; }

  .spine {
    position: relative;
    box-sizing: border-box;
    border-radius: 2px;
    border: .5px solid var(--edge);
    box-shadow: 2px 0 3px var(--drop);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex: none;
    transition: transform .12s ease;
  }
  .spine:hover, .spine:focus-visible { transform: translateY(-7px); outline: none; }
  .spine.is-active { transform: translateY(-11px); }
  .spine, .pile .flat, .book-cover {
    background-blend-mode: soft-light, luminosity;
  }
  .shelf-case[data-theme="artsy"] .spine {
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.1) 0 1px, transparent 1px 4px) !important;
    box-shadow: 1px 0 2px rgba(75,58,40,.26);
  }

  /* Vertical type, the way a real spine reads. */
  .spine .label {
    position: absolute;
    top: 13%;
    bottom: 24%;
    left: 4px;
    right: 4px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    letter-spacing: .025em;
    text-transform: uppercase;
    white-space: normal;
    overflow: hidden;
    text-overflow: clip;
    line-height: 1.05;
    text-align: center;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  .spine .spine-author {
    position: absolute;
    left: 3px;
    right: 3px;
    bottom: 7.5%;
    overflow: hidden;
    white-space: nowrap;
    text-align: center;
    text-transform: uppercase;
    font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    font-weight: 700;
    letter-spacing: .02em;
    line-height: 1;
    pointer-events: none;
  }
  .spine.type-modern .label { font-family: "Avenir Next", "Helvetica Neue", sans-serif; letter-spacing: .02em; }
  .spine.type-scholarly .label { font-family: Menlo, Monaco, monospace; letter-spacing: 0; }
  .spine.type-literary .label { font-family: Baskerville, Georgia, serif; font-style: italic; text-transform: none; }
  .spine .rule {
    position: absolute; left: 3px; right: 3px; height: 1px; opacity: .38;
  }

  .pile { display: flex; flex-direction: column; justify-content: flex-end; flex: none; }
  .pile .flat {
    box-sizing: border-box;
    border-radius: 2px;
    border: .5px solid var(--edge);
    box-shadow: 0 1px 3px var(--drop);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0 8px;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
    text-overflow: clip;
    line-height: 1;
  }
  .pile .flat > span {
    width: 100%;
    overflow: hidden;
    text-overflow: clip;
    white-space: nowrap;
    text-align: center;
  }

  .book-cover {
    position: relative;
    flex: none;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8% 7%;
    border: .5px solid var(--edge);
    border-radius: 3px;
    box-shadow: 3px 2px 5px var(--drop);
    overflow: hidden;
    cursor: pointer;
  }
  .book-cover:hover, .book-cover:focus-visible { transform: translateY(-7px); outline: none; }
  .book-cover .cover-author {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    font: 600 .66em/1.15 Georgia, serif;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .book-cover .cover-rule { width: 42%; height: 1px; margin: 8% 0; opacity: .42; background: currentColor; }
  .book-cover .cover-title { font: 400 1em/1.08 Georgia, serif; }
  .book-cover .cover-mark { margin-top: auto; opacity: .62; }

  .shelf-bar {
    display: flex; align-items: baseline; gap: 1em;
    margin-top: 1em; flex-wrap: wrap;
  }
  .shelf-shuffle {
    font: inherit; font-size: .9em;
    padding: .5em 1.1em;
    border: 1px solid currentColor; border-radius: 4px;
    background: none; color: inherit; cursor: pointer;
  }
  .shelf-shuffle:hover { background: rgba(0,0,0,.06); }
  .books-title-card .shelf-shuffle { margin-top: 1rem; }
  .shelf-caption { font-size: .9em; line-height: 1.4; }
  .shelf-caption a { text-decoration: underline; }

  body.demo-reader-open { overflow: hidden; }
  body.demo-reader-open > .books-page {
    filter: brightness(.38) saturate(.7);
    transform: scale(.995);
  }
  body > .books-page { transition: filter .25s ease, transform .25s ease; }
  .demo-reader {
    position: fixed;
    z-index: 500;
    inset: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(53,43,34,.3);
    border-radius: 18px;
    background: #f7f3eb;
    box-shadow: 0 28px 90px rgba(0,0,0,.48);
    animation: demo-reader-arrive .3s cubic-bezier(.2,.8,.2,1) both;
  }
  .demo-reader[hidden] { display: none; }
  @keyframes demo-reader-arrive {
    from { opacity: 0; transform: translateY(20px) scale(.988); }
    to { opacity: 1; transform: none; }
  }
  .demo-reader-toolbar {
    flex: none;
    min-height: 72px;
    display: grid;
    grid-template-columns: minmax(150px, 1fr) minmax(240px, 2fr) minmax(150px, 1fr);
    align-items: center;
    gap: 1rem;
    box-sizing: border-box;
    padding: .75rem 1.1rem;
    border-bottom: 1px solid rgba(53,43,34,.16);
    background: rgba(247,243,235,.97);
  }
  .demo-reader-close,
  .demo-reader-source {
    width: max-content;
    box-sizing: border-box;
    padding: .62rem .82rem;
    border: 1px solid rgba(53,43,34,.24);
    border-radius: 999px;
    color: #302820;
    background: transparent;
    font: 600 .77rem/1 "Avenir Next", "Helvetica Neue", sans-serif;
    text-decoration: none;
    cursor: pointer;
  }
  .demo-reader-close:hover,
  .demo-reader-close:focus-visible,
  .demo-reader-source:hover,
  .demo-reader-source:focus-visible { border-color: #8f3429; outline: none; color: #8f3429; }
  .demo-reader-heading { min-width: 0; text-align: center; }
  .demo-reader-heading p,
  .demo-reader-heading h2 { margin: 0; }
  .demo-reader-heading p {
    color: #8f3429;
    font: 700 .64rem/1.2 "Avenir Next", sans-serif;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  .demo-reader-heading h2 {
    overflow: hidden;
    color: #29231d;
    font: 400 1.45rem/1.15 Georgia, serif;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .demo-reader-actions {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: .7rem;
  }
  .demo-reader-actions > span {
    color: #756b5f;
    font: italic .74rem/1.2 Georgia, serif;
    white-space: nowrap;
  }
  .demo-reader-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    background:
      repeating-linear-gradient(0deg, rgba(85,64,40,.022) 0 1px, transparent 1px 5px),
      #f8f4ec;
  }
  .demo-reader-loading,
  .demo-reader-error {
    width: min(100% - 40px, 900px);
    margin: 8rem auto;
    color: #756b5f;
    font: italic 1rem/1.5 Georgia, serif;
    text-align: center;
  }
  .demo-reader-error { color: #8f3429; }
  .demo-reader-layout {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 680px) minmax(220px, 280px);
    justify-content: center;
    align-items: start;
    gap: clamp(3rem, 7vw, 7rem);
    width: min(100% - 50px, 1140px);
    margin: 0 auto;
    padding: 5rem 0 8rem;
  }
  .demo-reader-layout.no-notes {

  function shelfMetrics(theme, width, height) {
    var metrics = [];
    if (theme === 'oak' || theme === 'builtin') {
      var leftInset = (theme === 'oak' ? .075 : .076) * width;
      var rightInset = (theme === 'oak' ? .086 : .083) * width;
      var tops = theme === 'oak'
        ? [.034, .195, .351, .511, .670, .829]
        : [.041, .194, .342, .495, .645, .797];
      var baselines = theme === 'oak'
        ? [.181, .338, .496, .657, .815, .968]
        : [.174, .324, .477, .628, .780, .939];
      for (var framedRow = 0; framedRow < tops.length; framedRow++) {
        metrics.push({
          x: leftInset,
          y: tops[framedRow] * height,
          width: width - leftInset - rightInset,
          height: (baselines[framedRow] - tops[framedRow]) * height
        });
      }
      return metrics;
    }

    var inset = 5 * SCALE, rowHeight = height / 6;
    for (var row = 0; row < 6; row++) {
      metrics.push({x:inset, y:row * rowHeight, width:width - inset * 2, height:rowHeight});

  function cleanGutenbergPayload(raw) {
    var text = String(raw || '').replace(/\r/g, '');
    var markdownStart = text.indexOf('Markdown Content:');
    if (markdownStart >= 0) text = text.slice(markdownStart + 'Markdown Content:'.length);

    var start = text.search(/\*{3}\s*START OF (?:THIS|THE) PROJECT GUTENBERG EBOOK[^\n]*\*{3}/i);
    if (start >= 0) text = text.slice(text.indexOf('\n', start) + 1);
    var end = text.search(/\*{3}\s*END OF (?:THIS|THE) PROJECT GUTENBERG EBOOK[^\n]*\*{3}/i);
    if (end >= 0) text = text.slice(0, end);

    var chapterOne = /\n\s*(?:chapter|book)\s+(?:i|1)[.\s]/ig;
    var chapterMatches = [];
    var chapterMatch;
    while ((chapterMatch = chapterOne.exec(text))) chapterMatches.push(chapterMatch.index);
    if (chapterMatches.length > 1) text = text.slice(chapterMatches[1] + 1);

    return text
      .replace(/!\[[^\]]*\]\([^\n)]*\)/g, '')
      .replace(/\[([^\]]+)\]\([^\n)]*\)/g, '$1')
      .replace(/^\s*\[[^\]]*\]\s*$/gm, '')
      .replace(/^\s*\{?\d+\}?\s*$/gm, '')
      .replace(/^\s*\* \* \*\s*$/gm, '')
      .replace(/[_*]{1,3}/g, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();

  function isSectionHeading(text) {
    var value = text.replace(/^#+\s*/, '').trim();
    return /^(chapter|book|part|canto|act|scene|section)\b/i.test(value) ||
      (/^[A-Z0-9][A-Z0-9\s.,'’:“”\-—]+$/.test(value) && value.length <= 90);

  function appendTextBlock(container, lines) {
    var value = lines.join(' ').replace(/\s+/g, ' ').trim();
    if (!value || /^https?:\/\//i.test(value)) return;
    var element;
    if (isSectionHeading(value)) {
      element = document.createElement(/^#+\s*/.test(value) ? 'h2' : 'h3');
      value = value.replace(/^#+\s*/, '');
    } else {
      element = document.createElement('p');
    }
    element.textContent = value;
    container.appendChild(element);
  }

  function mountCleanText(raw, book) {
    readerText.innerHTML = '';

    var payload = cleanGutenbergPayload(raw);

    lines.forEach(function (line) {

      if (!value) {
        appendTextBlock(readerText, paragraph);
        paragraph = [];
        return;
      }
      if (/^#{1,4}\s+/.test(value) || (isSectionHeading(value) && paragraph.length)) {
        appendTextBlock(readerText, paragraph);
        paragraph = [];
        appendTextBlock(readerText, [value]);
        return;
      }
      paragraph.push(value);
    });

  function mountAnnotatedChapter(html, annotations, book) {

  function normalizeCharacters(value) {
    return String(value || '')
      .replace(/[“”]/g, '"')
      .replace(/[‘’]/g, "'")
      .replace(/[—–]/g, '-');
  }

  function isGarbage(annotation) {
    var surface = normalizeCharacters(annotation && annotation.surface).trim();
    return !surface || surface.length <= 2 || /^[A-Z]{2,4}$/.test(surface) ||
      (surface.indexOf('-') >= 0 && annotation.kind === 'reference') ||
      Number(annotation.confidence || 0) < .68;
  }

  function escapeRegex(value) {
    return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function textNodes(root) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var parent = node.parentElement;
        if (!parent || parent.closest('script, style, .inline-note-group, .book-opening')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    var node;
    while ((node = walker.nextNode())) nodes.push(node);
    return nodes;
  }

  function applyAnnotations(root, annotations) {
    var nodes = textNodes(root);
    var reserved = new Map();
    var selections = [];
    var seen = new Set();
    var candidates = annotations.filter(function (annotation) {
      return annotation && !isGarbage(annotation);
    }).sort(function (a, b) {
      var lengthDifference = normalizeCharacters(b.surface).length - normalizeCharacters(a.surface).length;
      return lengthDifference || Number(b.confidence || 0) - Number(a.confidence || 0);
    });

    candidates.forEach(function (annotation) {
      var surface = normalizeCharacters(annotation.surface).trim();
      var key = (annotation.kind || 'annotation') + ':' + surface.toLowerCase();
      if (seen.has(key)) return;
      var expression = new RegExp(escapeRegex(surface).replace(/\s+/g, '\\s+'), 'i');
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var match = expression.exec(normalizeCharacters(node.nodeValue));
        if (!match) continue;
        var start = match.index;
        var end = start + match[0].length;
        var ranges = reserved.get(node) || [];
        if (ranges.some(function (range) { return start < range.end && end > range.start; })) continue;
        ranges.push({start: start, end: end});
        reserved.set(node, ranges);
        selections.push({node: node, start: start, end: end, annotation: annotation});
        seen.add(key);
        break;
      }
    });

    var grouped = new Map();
    selections.forEach(function (selection) {
      var group = grouped.get(selection.node) || [];
      group.push(selection);
      grouped.set(selection.node, group);
    });

    var mounted = [];
    grouped.forEach(function (group, node) {
      group.sort(function (a, b) { return a.start - b.start; });
      var fragment = document.createDocumentFragment();
      var cursor = 0;
      group.forEach(function (selection) {
        if (selection.start > cursor) fragment.appendChild(document.createTextNode(node.nodeValue.slice(cursor, selection.start)));
        var span = document.createElement('span');
        span.className = 'reading-annotation annotation-' + (selection.annotation.kind || 'annotation');
        span.textContent = node.nodeValue.slice(selection.start, selection.end);
        fragment.appendChild(span);
        mounted.push({span: span, annotation: selection.annotation});
        cursor = selection.end;
      });
      if (cursor < node.nodeValue.length) fragment.appendChild(document.createTextNode(node.nodeValue.slice(cursor)));
      node.parentNode.replaceChild(fragment, node);
    });
    return mounted;
  }

      body: dictionary.definition || gloss.text || payload.summary || 'No annotation content.'

  function positionMarginalia() {

  function normalizeText(value) {

  function coverURL(doc) {
    if (doc.cover_i) return 'https://covers.openlibrary.org/b/id/' + doc.cover_i + '-L.jpg?default=false';
    if (Array.isArray(doc.edition_key) && doc.edition_key.length) {
      return 'https://covers.openlibrary.org/b/olid/' + doc.edition_key[0] + '-L.jpg?default=false';

  function chooseMatch(docs, requestedTitle, requestedAuthor) {
    if (!docs.length) return null;
    var wantedTitle = normalizeText(requestedTitle).toLowerCase();
    var wantedAuthor = normalizeText(requestedAuthor).toLowerCase();
    return docs.map(function (doc, index) {
      var title = normalizeText(doc.title).toLowerCase();
      var author = normalizeText((doc.author_name && doc.author_name[0]) || '').toLowerCase();
      var score = 0;
      if (title === wantedTitle) score += 14;
      if (title.indexOf(wantedTitle) === 0) score += 9;
      if (title.indexOf(wantedTitle) >= 0) score += 5;
      if (wantedAuthor && author === wantedAuthor) score += 10;
      if (wantedAuthor && author.indexOf(wantedAuthor) >= 0) score += 5;
      if (doc.cover_i) score += 3;
      if (doc.number_of_pages_median) score += 2;
      if (typeof doc.first_publish_year === 'number') score += 1;
      score -= index * .2;
      return { doc: doc, score: score };
    }).sort(function (a, b) {
      return b.score - a.score;
    })[0].doc;
  }

  async function resolveBook(query) {
    var params = new URLSearchParams({
      limit: '10',
      fields: 'key,title,author_name,cover_i,edition_key,first_publish_year,number_of_pages_median'
    });
    params.set('q', query);
    var response = await fetch('https://openlibrary.org/search.json?' + params.toString(), {
      headers: { Accept: 'application/json' }
    });
    if (!response.ok) throw new Error('Book lookup is temporarily unavailable.');
    var payload = await response.json();
    var docs = Array.isArray(payload.docs) ? payload.docs : [];
    var match = chooseMatch(docs, query, query);
    if (!match) throw new Error('Doesnt know. do u want to add this book manually?');
    return {
      id: customBookId({
        title: normalizeText(match.title) || normalizeText(query),
        author: normalizeText((match.author_name && match.author_name[0]) || '')
      }),
      title: normalizeText(match.title) || normalizeText(query),
      author: normalizeText((match.author_name && match.author_name[0]) || 'Unknown author'),
      pages: Number(match.number_of_pages_median) || 320,
      firstPublishYear: match.first_publish_year || null,
      cover: coverURL(match),
      source: null

  }

  function pinBook(bookId) {
    var pinned = customBooks.map(function (book) { return book.id; }).filter(Boolean);
    if (bookId && pinned.indexOf(bookId) < 0) pinned.unshift(bookId);
    spotlightIds = pinned;
  }

  function starterQuery() {
    if (!LIBRARY.length) return '';
    var seed = Math.floor(Date.now() / 3600000);
    var book = LIBRARY[Math.abs(seed) % LIBRARY.length];
    if (!book) return '';
    return (seed % 2 === 0 ? book.title : (book.author || book.title)) || '';
  }

  function mergeBook(book) {
    customBooks = customBooks.filter(function (entry) { return entry.id !== book.id; });
    customBooks.unshift(book);
    if (customBooks.length > CUSTOM_BOOK_LIMIT) customBooks = customBooks.slice(0, CUSTOM_BOOK_LIMIT);
    persistCustomBooks();
    rebuildLibrary();
    pinBook(book.id);
    renderShelfListing();
  }

  function prioritizedPool(seed) {
    var rand = rngFrom(seed);
    var spotlight = [];
    var remainder = [];
    library.forEach(function (book) {
      if (spotlightIds.indexOf(book.id) >= 0) spotlight.push(book);
      else remainder.push(book);
    });
    return spotlight.concat(shuffled(remainder, rand));
  }

  function pageCountLabel(book) {
    return (book.pages || 0) + 'p';
  }

  function swatchColor(book) {
    return rgb(clothOf(book));
  }

  function listItem(book) {
    var item = document.createElement(book.source ? 'a' : 'article');
    var swatch = document.createElement('div');
    var copy = document.createElement('div');
    var title = document.createElement('p');
    var author = document.createElement('p');
    var pages = document.createElement('p');

    item.className = 'shelf-list-item' + (book.source ? ' is-link' : '');
    swatch.className = 'shelf-list-swatch';
    copy.className = 'shelf-list-copy';
    title.className = 'shelf-list-book-title';
    author.className = 'shelf-list-book-author';
    pages.className = 'shelf-list-book-pages';

    swatch.style.background = swatchColor(book);
    title.textContent = book.title || '';
    author.textContent = book.author || 'Unknown author';
    pages.textContent = pageCountLabel(book);

    if (book.source) {
      item.href = book.source;
      item.addEventListener('click', function (event) {
        event.preventDefault();
        openReader(book, item);
      });
    }

    copy.appendChild(title);
    copy.appendChild(author);
    item.appendChild(swatch);
    item.appendChild(copy);
    item.appendChild(pages);
    return item;
  }

  function fillList(target, books) {
    target.innerHTML = '';
    books.forEach(function (book) {
      target.appendChild(listItem(book));
    });
  }

  function renderShelfListing() {
    addedBooksGroup.hidden = !customBooks.length;
    fillList(addedBooksList, customBooks);
    fillList(demoBooksList, LIBRARY);
  }

  function fitRenderedType() {
    Array.prototype.forEach.call(shelf.querySelectorAll('.spine .label'), function (label) {
      var size = Number.parseFloat(label.style.fontSize) || 8;
      while ((label.scrollHeight > label.clientHeight || label.scrollWidth > label.clientWidth) && size > 4.5) {
        size -= .5;
        label.style.fontSize = size + 'px';
      }
    });
    Array.prototype.forEach.call(shelf.querySelectorAll('.pile .flat'), function (flat) {
      var size = Number.parseFloat(flat.style.fontSize) || 8;
      var text = flat.firstElementChild || flat;
      while ((text.scrollWidth > text.clientWidth || flat.scrollHeight > flat.clientHeight) && size > 3) {
        size -= .5;
        flat.style.fontSize = size + 'px';
      }
    });
    Array.prototype.forEach.call(shelf.querySelectorAll('.spine .spine-author, .book-cover .cover-author'), function (author) {
      var size = Number.parseFloat(window.getComputedStyle(author).fontSize) || 8;
      var floor = author.classList.contains('spine-author') ? 7.5 : 3;
      while ((author.scrollWidth > author.clientWidth || author.scrollHeight > author.clientHeight) && size > floor) {
        size -= .5;
        author.style.fontSize = size + 'px';
      }
    });
  }

  function render() {
    if (!library.length) return;
    var width = shelf.clientWidth;
    if (width < 40) return;
    var height = shelf.clientHeight;
    SCALE = width / 350;
    shelf.innerHTML = '';
    active = null;

    var theme = shelf.getAttribute('data-theme') || 'classic';
    var seed = manualSeed !== null ? manualSeed : Math.floor(Date.now() / 3600000);
    var variant = LAYOUTS[((seed % LAYOUTS.length) + LAYOUTS.length) % LAYOUTS.length];
    shelf.setAttribute('data-layout', variant);
    var pool = prioritizedPool(seed);
    var metrics = shelfMetrics(theme, width, height);
    var framed = theme === 'oak' || theme === 'builtin';
    var used = {};

    metrics.forEach(function (metric, r) {
      var row = document.createElement('div');
      row.className = 'shelf-row' + (framed ? ' is-framed' : '');
      row.style.left = metric.x + 'px';
      row.style.top = metric.y + 'px';
      row.style.width = metric.width + 'px';
      row.style.height = metric.height + 'px';

      var boardHeight = (framed ? 0 : 6) * SCALE;
      row.style.paddingBottom = boardHeight + 'px';

      if (framed) {
        var rowBooks = [];
        for (var n = 0; n < 16; n++) rowBooks.push(pool[(r * 16 + n) % pool.length]);
        renderFramedRow(row, rowBooks, theme, variant, r % 2, metric.width, metric.height);
      } else {
        var spineSpace = metric.height - boardHeight - 6 * SCALE;
        var available = pool.filter(function (book) { return !used[book.id]; });
        var capacity = available.reduce(function (sum, book) {
          return sum + spineWidth(book) + 1.5 * SCALE;
        }, 0);
        if (capacity < metric.width * 1.5) available = pool;
        var items = buildRow(available, metric.width, spineSpace, seed + r * 7919, variant);
        items.forEach(function (item) {
          if (item.kind === 'pile') {
            item.books.forEach(function (book) { used[book.id] = true; });
            row.appendChild(pileEl(item.books, spineSpace));
          } else {
            used[item.book.id] = true;
            row.appendChild(spineEl(item.book, spineSpace * heightFactor(item.book),
                                    item.kind === 'leaning'));
          }
        });

      }

      var board = document.createElement('div');
      board.className = 'board';
      board.style.height = boardHeight + 'px';
      row.appendChild(board);

      shelf.appendChild(row);
    });

    var layoutName = variant.charAt(0).toUpperCase() + variant.slice(1);
    caption.textContent = library.length + ' books on the list · ' + layoutName + ' layout · reshuffles every hour.';
    requestAnimationFrame(fitRenderedType);
  }

  // Theme choice sticks between visits, the way it does in the app.
  var themeBar = document.getElementById('themes');
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('shelfTheme'); } catch (e) {}
  if (savedTheme) applyTheme(savedTheme);

  function applyTheme(name) {
    if (!themeBar.querySelector('[data-theme="' + name + '"]')) return;
    shelf.setAttribute('data-theme', name);
    Array.prototype.forEach.call(themeBar.children, function (b) {
      b.classList.toggle('is-on', b.dataset.theme === name);
    });
    try { localStorage.setItem('shelfTheme', name); } catch (e) {}
    render();
  }

  themeBar.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) applyTheme(btn.dataset.theme);
  });

  shuffleBtn.addEventListener('click', function () {
    pinBook();
    manualSeed = Math.floor(Math.random() * 2147483647);
    render();
  });

  addBookForm.addEventListener('submit', async function (event) {
    event.preventDefault();
    var query = normalizeText(queryInput.value);
    if (!query) {
      announceStatus('Enter a title or author first.', true);
      queryInput.focus();
      return;
    }
    addBookSubmit.disabled = true;
    announceStatus('Looking up the closest edition...', false);
    try {
      var book = await resolveBook(query);
      mergeBook(book);
      manualSeed = Math.floor(Math.random() * 2147483647);
      renderResolvedBook(book);
      announceStatus('', false);
      render();
      queryInput.value = '';
      queryInput.focus();
    } catch (error) {
      announceStatus((error && error.message) || 'That book could not be added right now.', true);
    } finally {
      addBookSubmit.disabled = false;
    }
  });

  clearAddedBooksBtn.addEventListener('click', function () {
    customBooks = [];
    spotlightIds = [];
    clearTimeout(resolvedBookTimer);
    persistCustomBooks();
    rebuildLibrary();
    resolvedBook.hidden = true;
    announceStatus('', false);
    renderShelfListing();
    render();
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (reader.hidden) render();
      else positionMarginalia();
    }, 150);
  });

  customBooks = loadCustomBooks();
  rebuildLibrary();
  pinBook();
  if (!queryInput.value) queryInput.value = starterQuery();
  if (customBooks.length) {
    renderResolvedBook(customBooks[0]);
  }
  persistCustomBooks();
  renderShelfListing();
  caption.textContent = library.length + ' books on the list. Reshuffles every hour.';
  render();
})();
</script>

</html>
