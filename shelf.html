---
title: WoodWork
permalink: /shelf/
---
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">

    <title>WoodWork</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/favicon.png">

    <link href="/assets/css/books-unified.css" rel="stylesheet">
  </head>

  <body class="books-page">
    <div class="books-page">

      <!-- Header -->
      <header class="books-masthead">
        <div class="books-masthead-inner">
          <a class="books-site-title" href="/">Joseph Ruocco</a>

          <nav class="books-nav" aria-label="Primary">
            <a href="/shelf/" class="active">WoodWork</a>
            <a href="/about/">About</a>
            <a href="/projects/">Projects</a>
          </nav>
        </div>
      </header>

      <!-- Title card -->
      <section class="books-title-card" aria-labelledby="shelf-page-title">
        <div class="books-title-card-inner">
          <h1 id="shelf-page-title">WoodWork</h1>
          <p>Every book, drawn as a physical shelf — each spine as thick as the book really is.</p>
        </div>
      </section>

      <main class="books-content" id="main-content">
        <div class="shelf-page">
          <div class="shelf-themes" id="themes" role="group" aria-label="Shelf style">
            <button type="button" data-theme="classic" class="is-on">Classic</button>
            <button type="button" data-theme="oak">Dark Oak</button>
            <button type="button" data-theme="builtin">White Built-In</button>
            <button type="button" data-theme="artsy">Artsy</button>
          </div>

          <div class="shelf-case" id="shelf" data-theme="classic" role="img"
               aria-label="A bookshelf of randomly selected books"></div>

          <div class="shelf-bar">
            <button type="button" class="shelf-shuffle" id="shuffle">Pull a new handful</button>
            <span class="shelf-caption" id="caption">Reshuffles every hour.</span>
          </div>
        </div>
      </main>

    </div>

<style>
  .shelf-page { margin: 2em 0 3em; }
  .shelf-heading { margin-bottom: .3em; }
  .shelf-intro { max-width: 34em; margin-bottom: 1.4em; line-height: 1.5; }

  /* The web shelf uses the same proportions and materials as the iOS shelf. */
  .shelf-case[data-theme="classic"] {
    --back: linear-gradient(#20180f, #0f0b07);
    --board: linear-gradient(to bottom, #6b4a2d, #4c3320);
    --case: #2a1e13; --edge: rgba(0,0,0,.35); --drop: rgba(0,0,0,.45);
  }
  .shelf-case[data-theme="oak"] {
    --case: #172219; --edge: rgba(0,0,0,.55); --drop: rgba(0,0,0,.6);
    background: #172219 url('/assets/images/woodwork/dark-oak-six.webp') center / 124% 100% no-repeat;
  }
  .shelf-case[data-theme="builtin"] {
    --case: #d9d4c8; --edge: rgba(0,0,0,.22); --drop: rgba(0,0,0,.28);
    background: #d9d4c8 url('/assets/images/woodwork/white-built-in-six.webp') center / 134% 100% no-repeat;
  }
  .shelf-case[data-theme="artsy"] {
    --back:
      repeating-linear-gradient(0deg, rgba(80,66,44,.045) 0 1px, transparent 1px 5px),
      linear-gradient(#f4efe4, #e7decb);
    --board: linear-gradient(to bottom, #cbb188, #b2966b);
    --case: #efe7d7; --edge: rgba(60,50,40,.45); --drop: rgba(90,75,60,.28);
  }

  .shelf-case {
    width: 100%;
    max-width: none;
    /* Six rows at roughly the same visual height as the cover cards. */
    aspect-ratio: 4 / 7;
    position: relative;
    box-sizing: border-box;
    border-radius: 28px;
    overflow: hidden;
    background-color: var(--case);
    box-shadow: 0 10px 30px rgba(0,0,0,.22);
  }

  .shelf-case[data-theme="oak"],
  .shelf-case[data-theme="builtin"] { border-radius: 36px; }

  .shelf-case[data-theme="oak"]::before,
  .shelf-case[data-theme="builtin"]::before {
    display: none;
  }

  .shelf-row {
    position: absolute;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    box-sizing: border-box;
    overflow: hidden;
  }
  .shelf-case[data-theme="classic"] .shelf-row,
  .shelf-case[data-theme="artsy"] .shelf-row { background: var(--back); }
  .shelf-row .board {
    position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
    background: var(--board);
    box-shadow: 0 3px 6px var(--drop);
  }
  .shelf-case[data-theme="oak"] .board,
  .shelf-case[data-theme="builtin"] .board {
    display: none;
  }

  .shelf-themes {
    display: flex; flex-wrap: wrap; gap: .4em;
    margin-bottom: 1em;
  }
  .shelf-themes button {
    font: inherit; font-size: .82em;
    padding: .38em .85em;
    border: 1px solid rgba(0,0,0,.25); border-radius: 999px;
    background: none; color: inherit; cursor: pointer;
  }
  .shelf-themes button.is-on { background: #222; color: #fff; border-color: #222; }

  .spine {
    position: relative;
    box-sizing: border-box;
    border-radius: 2px;
    border: .5px solid var(--edge);
    box-shadow: 2px 0 3px var(--drop);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex: none;
    transition: transform .12s ease;
  }
  .spine:hover, .spine:focus-visible { transform: translateY(-7px); outline: none; }
  .spine.is-active { transform: translateY(-11px); }
  .spine, .pile .flat, .book-cover {
    background-blend-mode: soft-light, luminosity;
  }
  .shelf-case[data-theme="artsy"] .spine {
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.1) 0 1px, transparent 1px 4px) !important;
    box-shadow: 1px 0 2px rgba(75,58,40,.26);
  }

  /* Vertical type, the way a real spine reads. */
  .spine .label {
    position: absolute;
    top: 13%;
    bottom: 19%;
    left: 4px;
    right: 4px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    letter-spacing: .025em;
    text-transform: uppercase;
    white-space: normal;
    overflow: hidden;
    text-overflow: clip;
    line-height: 1.05;
    text-align: center;
    pointer-events: none;
  }
  .spine .spine-author {
    position: absolute;
    left: 3px;
    right: 3px;
    bottom: 5.5%;
    overflow: hidden;
    white-space: nowrap;
    text-align: center;
    text-transform: uppercase;
    font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    font-weight: 700;
    letter-spacing: .04em;
    line-height: 1;
    pointer-events: none;
  }
  .spine.type-modern .label { font-family: "Avenir Next", "Helvetica Neue", sans-serif; letter-spacing: .02em; }
  .spine.type-scholarly .label { font-family: Menlo, Monaco, monospace; letter-spacing: 0; }
  .spine.type-literary .label { font-family: Baskerville, Georgia, serif; font-style: italic; text-transform: none; }
  .spine .rule {
    position: absolute; left: 3px; right: 3px; height: 1px; opacity: .38;
  }

  .pile { display: flex; flex-direction: column; justify-content: flex-end; flex: none; }
  .pile .flat {
    box-sizing: border-box;
    border-radius: 2px;
    border: .5px solid var(--edge);
    box-shadow: 0 1px 3px var(--drop);
    cursor: pointer;
    /* Left-aligned with an ellipsis: centring clips a long title at both ends,
       which reads as a rendering fault rather than a long title. */
    display: flex; align-items: center; justify-content: flex-start;
    padding: 0 8px;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
    text-overflow: clip;
  }
  .pile .flat > span { overflow: hidden; text-overflow: clip; }

  .book-cover {
    position: relative;
    flex: none;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8% 7%;
    border: .5px solid var(--edge);
    border-radius: 3px;
    box-shadow: 3px 2px 5px var(--drop);
    overflow: hidden;
    cursor: pointer;
  }
  .book-cover:hover, .book-cover:focus-visible { transform: translateY(-7px); outline: none; }
  .book-cover .cover-author { font: 600 .66em/1.15 Georgia, serif; letter-spacing: .08em; text-transform: uppercase; }
  .book-cover .cover-rule { width: 42%; height: 1px; margin: 8% 0; opacity: .42; background: currentColor; }
  .book-cover .cover-title { font: 400 1em/1.08 Georgia, serif; }
  .book-cover .cover-mark { margin-top: auto; opacity: .62; }

  .shelf-bar {
    display: flex; align-items: baseline; gap: 1em;
    margin-top: 1em; flex-wrap: wrap;
  }
  .shelf-shuffle {
    font: inherit; font-size: .9em;
    padding: .5em 1.1em;
    border: 1px solid currentColor; border-radius: 4px;
    background: none; color: inherit; cursor: pointer;
  }
  .shelf-shuffle:hover { background: rgba(0,0,0,.06); }
  .shelf-caption { font-size: .9em; line-height: 1.4; }
  .shelf-caption a { text-decoration: underline; }

  @media (max-width: 600px) {
    .shelf-case { border-radius: 18px; }
    .shelf-case[data-theme="oak"], .shelf-case[data-theme="builtin"] { border-radius: 22px; }
    .book-cover { padding: 7% 5%; }
  }
</style>

<script>
(function () {
  var shelf = document.getElementById('shelf');
  var caption = document.getElementById('caption');
  var shuffleBtn = document.getElementById('shuffle');

  // Built at build time from _data/shelf.yml. Books that also have a write-up
  // in the reading list get a link through to it.
  var NOTES = { {% for b in site.books %}{{ b.title | jsonify }}: {{ b.url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %} };

  var LIBRARY = [{% for b in site.data.shelf %}
    {"id": {{ b.title | jsonify }},
     "title": {{ b.title | jsonify }},
     "author": {{ b.author | jsonify }},
     "pages": {{ b.pages | default: 288 }}}{% unless forloop.last %},{% endunless %}{% endfor %}
  ];

  var PALETTE = [
    [.43,.17,.17],[.18,.28,.22],[.15,.22,.31],[.65,.46,.23],
    [.85,.81,.71],[.35,.19,.29],[.17,.35,.35],[.55,.29,.18],
    [.29,.31,.35],[.37,.42,.22],[.49,.25,.18],[.22,.22,.23],
    [.69,.54,.24],[.56,.23,.23]
  ];

  var SCALE = 1;
  var LEAN = 9;
  var COS = Math.cos(LEAN * Math.PI / 180), SIN = Math.sin(LEAN * Math.PI / 180);
  var LAYOUTS = ['balanced', 'stacked', 'gallery'];

  // Same stable hash as the app: colour and height must not change between
  // renders, and JS string hashing isn't standardised.
  function fnv1a(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h >>> 0;
  }
  function hashOf(book, salt) { return fnv1a(book.id + '#' + salt); }

  function rgb(c, shift) {
    shift = shift || 0;
    return 'rgb(' + PALETTE[c].map(function (v) {
      return Math.round(Math.max(0, Math.min(1, v + shift)) * 255);
    }).join(',') + ')';
  }
  function luminance(c) { var p = PALETTE[c]; return .2126*p[0] + .7152*p[1] + .0722*p[2]; }

  function spineWidth(b) { return Math.min(44, Math.max(9, b.pages * 0.075)) * SCALE; }
  function heightFactor(b) { return 0.84 + 0.16 * ((hashOf(b, 1) % 10000) / 10000); }
  function clothOf(b) { return hashOf(b, 2) % PALETTE.length; }
  function textureOf(b) { return (hashOf(b, 3) % 12) + 1; }
  function shortTitle(b) { return b.title.split(':')[0]; }
  function coreTitle(book) {
    return shortTitle(book)
      .replace(/\s*\([^)]*\)\s*/g, ' ')
      .replace(/\s+[—–-]\s+.*$/, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function authorSurname(book) {
    var author = (book.author || '').trim();
    if (!author) return '';
    if (author.indexOf(',') >= 0) return author.split(',')[0].trim();
    var words = author.split(/\s+/);
    return words[words.length - 1];
  }
  function typographyOf(b) {
    var text = (b.title + ' ' + (b.author || '')).toLowerCase();
    if (/meditations|plato|aristotle|virgil|homer|aurelius|dickens|tolstoy|woolf|eliot|odyssey|middlemarch/.test(text)) return 'classic';
    if (/habit|mindset|success|self|productivity|guide|how to|startup|improve|leadership|daily|work/.test(text)) return 'modern';
    if (/analysis|statistics|calculus|mathematics|probability|physics|econometrics|journal|science|theory|models/.test(text)) return 'scholarly';
    return 'literary';
  }
  function textureURL(book) {
    var n = textureOf(book);
    return "url('/assets/images/woodwork/spine-" + (n < 10 ? '0' : '') + n + ".png')";
  }

  // SplitMix32 — a seeded RNG so a given hour always draws the same shelf.
  function rngFrom(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x9E3779B9) >>> 0;
      var z = s;
      z = (Math.imul(z ^ (z >>> 16), 0x21f0aaad)) >>> 0;
      z = (Math.imul(z ^ (z >>> 15), 0x735a2d97)) >>> 0;
      return ((z ^ (z >>> 15)) >>> 0) / 4294967296;
    };
  }
  function shuffled(arr, rand) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* Greedy fill, best of a few shuffles — the arrangement with the smallest
     trailing gap is what stops the shelf looking half-empty. */
  function bestFit(books, width, seed) {
    var best = [], bestGap = Infinity;
    for (var attempt = 0; attempt < 8; attempt++) {
      var rand = rngFrom(seed + attempt * 977);
      var used = 0, picked = [];
      var pool = shuffled(books, rand);
      for (var i = 0; i < pool.length; i++) {
        var next = used + spineWidth(pool[i]) + 1.5 * SCALE;
        if (next > width) continue;
        picked.push(pool[i]);
        used = next;
        if (width - used < 16) break;
      }
      if (width - used < bestGap) { bestGap = width - used; best = picked; }
      if (bestGap < 10) break;
    }
    return best;
  }

  function buildRow(pool, width, spineSpace, seed, variant) {
    var rand = rngFrom(seed);
    var items = [], remaining = pool.slice();

    var pileChance = variant === 'stacked' ? 0.9 : (variant === 'gallery' ? 0.2 : 0.5);
    var pile = null;
    if (width >= 240 * SCALE && rand() < pileChance) {
      var want = variant === 'stacked' ? 3 + Math.floor(rand() * 2) : 2 + Math.floor(rand() * 2);
      var picked = [], stackH = 0;
      for (var i = 0; i < remaining.length && picked.length < want; i++) {
        var b = remaining[i];
        var flat = spineSpace * heightFactor(b);
        if (flat > width * 0.5) continue;
        if (stackH + spineWidth(b) > spineSpace * 0.55) continue;
        picked.push(b); stackH += spineWidth(b);
      }
      if (picked.length >= 2) {
        pile = picked;
        remaining = remaining.filter(function (x) { return picked.indexOf(x) < 0; });
      }
    }
    var pileWidth = pile ? Math.max.apply(null, pile.map(function (b) {
      return spineSpace * heightFactor(b);
    })) : 0;

    var leanChance = variant === 'stacked' ? 0.3 : (variant === 'gallery' ? 0.9 : 0.7);
    var slackBase = variant === 'stacked' ? 8 : (variant === 'gallery' ? 14 : 16);
    var slackRange = variant === 'stacked' ? 8 : (variant === 'gallery' ? 10 : 14);
    var wantsLean = rand() < leanChance;
    var slack = wantsLean ? spineSpace * SIN + (slackBase + rand() * slackRange) * SCALE : 0;
    var standing = bestFit(remaining, Math.max(0, width - pileWidth - slack - 4), seed);

    standing.forEach(function (b) { items.push({ kind: 'upright', book: b }); });
    if (wantsLean && items.length >= 2) items[items.length - 1].kind = 'leaning';
    if (pile) items.push({ kind: 'pile', books: pile });
    return items;
  }

  function spineEl(book, height, leaning, options) {
    options = options || {};
    var c = clothOf(book);
    var light = luminance(c) > 0.5;
    var ink = light ? 'rgba(46,33,23,.92)' : 'rgba(237,227,199,.92)';
    var w = spineWidth(book) * (options.widthScale || 1);

    var el = document.createElement('div');
    el.className = 'spine type-' + typographyOf(book);
    el.tabIndex = 0;
    el.style.width = w + 'px';
    el.style.height = (leaning ? height * 0.97 : height) + 'px';
    el.style.marginRight = options.framed ? '0' : (1.5 * SCALE) + 'px';
    el.style.backgroundColor = rgb(c);
    el.style.backgroundImage = 'linear-gradient(to right, rgba(255,255,255,.16), transparent 46%, rgba(0,0,0,.28)), ' + textureURL(book);
    el.style.backgroundSize = '100% 100%, cover';
    el.style.backgroundPosition = 'center';

    if (leaning) {
      el.style.transformOrigin = 'bottom left';
      el.style.transform = 'rotate(' + LEAN + 'deg)';
      el.style.marginRight = (w * COS + height * SIN - w + 1.5 * SCALE) + 'px';
    }

    [0.12, 0.16, 0.84].forEach(function (t) {
      var r = document.createElement('span');
      r.className = 'rule';
      r.style.top = (t * 100) + '%';
      r.style.background = ink;
      el.appendChild(r);
    });

    if (w >= 20) {
      var label = document.createElement('span');
      label.className = 'label';
      var labelTitle = coreTitle(book);
      label.textContent = labelTitle;
      label.style.color = ink;
      label.style.textShadow = light ? '0 1px rgba(255,255,255,.3)' : '0 1px 2px rgba(0,0,0,.8)';
      var titleLength = Math.max(1, labelTitle.length);
      var titleArea = height * .66 * Math.max(8, w - 8);
      var fittedSize = Math.sqrt(titleArea / (titleLength * 1.25));
      label.style.fontSize = Math.max(6, Math.min(13 * SCALE, w * .34, fittedSize)) + 'px';
      el.appendChild(label);
    }

    var surname = authorSurname(book);
    if (surname && w >= 18) {
      var author = document.createElement('span');
      author.className = 'spine-author';
      author.textContent = surname;
      author.style.color = ink;
      author.style.textShadow = light ? '0 1px rgba(255,255,255,.28)' : '0 1px 1px rgba(0,0,0,.8)';
      var authorFit = (w - 6) / Math.max(1, surname.length * .63);
      author.style.fontSize = Math.max(4.5, Math.min(7 * SCALE, w * .16, authorFit)) + 'px';
      el.appendChild(author);
    }
    el.setAttribute('aria-label', book.title + (book.author ? ', ' + book.author : ''));
    wire(el, book);
    return el;
  }

  function pileEl(books, spineSpace, options) {
    options = options || {};
    var wrap = document.createElement('div');
    wrap.className = 'pile';
    wrap.style.width = options.targetWidth ? options.targetWidth + 'px' : 'auto';
    wrap.style.marginRight = options.framed ? '0' : (1.5 * SCALE) + 'px';
    books.forEach(function (book) {
      var c = clothOf(book);
      var light = luminance(c) > 0.5;
      var ink = light ? 'rgba(46,33,23,.92)' : 'rgba(237,227,199,.92)';
      var flat = document.createElement('div');
      flat.className = 'flat';
      flat.tabIndex = 0;
      flat.style.width = (spineSpace * heightFactor(book)) + 'px';
      flat.style.height = (spineWidth(book) * (options.thicknessScale || 1)) + 'px';
      flat.style.backgroundColor = rgb(c);
      flat.style.backgroundImage = 'linear-gradient(to bottom, rgba(255,255,255,.16), transparent 46%, rgba(0,0,0,.28)), ' + textureURL(book);
      flat.style.backgroundSize = '100% 100%, cover';
      flat.style.color = ink;
      var flatTitle = coreTitle(book);
      var flatWidth = spineSpace * heightFactor(book);
      var flatFit = flatWidth / Math.max(1, flatTitle.length * .62);
      flat.style.fontSize = Math.max(5, Math.min(10 * SCALE, spineWidth(book) * .34, flatFit)) + 'px';
      flat.style.fontWeight = '600';
      flat.style.textShadow = light ? '0 1px rgba(255,255,255,.3)' : '0 1px 2px rgba(0,0,0,.75)';
      if (spineWidth(book) >= 18) {
        var t = document.createElement('span');
        t.textContent = flatTitle;
        flat.appendChild(t);
      }
      flat.setAttribute('aria-label', book.title + (book.author ? ', ' + book.author : ''));
      wire(flat, book);
      wrap.appendChild(flat);
    });
    return wrap;
  }

  function coverEl(book, width, height) {
    var c = clothOf(book), light = luminance(c) > 0.5;
    var ink = light ? 'rgba(46,33,23,.94)' : 'rgba(237,227,199,.94)';
    var cover = document.createElement('div');
    cover.className = 'book-cover';
    cover.tabIndex = 0;
    cover.style.width = width + 'px';
    cover.style.height = height + 'px';
    cover.style.fontSize = Math.max(7, Math.min(11 * SCALE, width * .085)) + 'px';
    cover.style.color = ink;
    cover.style.backgroundColor = rgb(c);
    cover.style.backgroundImage = 'linear-gradient(135deg, rgba(255,255,255,.13), transparent 52%, rgba(0,0,0,.22)), ' + textureURL(book);
    cover.style.backgroundSize = '100% 100%, cover';

    var author = document.createElement('span');
    author.className = 'cover-author';
    author.textContent = book.author || '';
    var rule = document.createElement('span');
    rule.className = 'cover-rule';
    var title = document.createElement('span');
    title.className = 'cover-title';
    title.textContent = coreTitle(book);
    var mark = document.createElement('span');
    mark.className = 'cover-mark';
    mark.textContent = '❧';
    cover.appendChild(author); cover.appendChild(rule); cover.appendChild(title); cover.appendChild(mark);
    wire(cover, book);
    return cover;
  }

  function bookAt(books, index) { return books[index % books.length]; }

  function uprightRun(row, books, indexes, width, rowHeight, heights) {
    var selected = indexes.map(function (i) { return bookAt(books, i); });
    var natural = selected.reduce(function (sum, book) { return sum + spineWidth(book); }, 0) || 1;
    var widthScale = width / natural;
    selected.forEach(function (book, index) {
      row.appendChild(spineEl(book, rowHeight * heights[index % heights.length], false, {
        framed: true,
        widthScale: widthScale
      }));
    });
  }

  function fittedPile(row, books, indexes, width, rowHeight) {
    var selected = indexes.map(function (i) { return bookAt(books, i); });
    var maxFactor = Math.max.apply(null, selected.map(heightFactor));
    var naturalHeight = selected.reduce(function (sum, book) { return sum + spineWidth(book); }, 0) || 1;
    row.appendChild(pileEl(selected, width / Math.max(.1, maxFactor), {
      framed: true,
      targetWidth: width,
      thicknessScale: Math.min(.82, rowHeight * .42 / naturalHeight)
    }));
  }

  function indexes(from, through) {
    var result = [];
    for (var i = from; i <= through; i++) result.push(i);
    return result;
  }

  function composition(theme, variant, row) {
    if (theme === 'oak') {
      if (variant === 'balanced' && row === 0) return [
        ['cover',[0],.17,.88], ['run',indexes(1,3),.16,[.78,.86,.81]],
        ['pile',indexes(4,6),.23], ['run',indexes(7,9),.17,[.84,.77,.88]],
        ['cover',[10],.18,.84], ['run',indexes(11,12),.09,[.76,.82]]
      ];
      if (variant === 'balanced') return [
        ['run',indexes(0,3),.25,[.88,.82,.91,.79]], ['cover',[4],.21,.92],
        ['run',indexes(5,12),.54,[.84,.90,.81,.86,.78,.88,.83,.89]]
      ];
      if (variant === 'stacked' && row === 0) return [
        ['pile',indexes(0,2),.24], ['run',indexes(3,7),.32,[.82,.90,.77,.86,.80]],
        ['cover',[8],.22,.90], ['run',indexes(9,13),.22,[.84,.76,.88,.81,.86]]
      ];
      if (variant === 'stacked') return [
        ['cover',[0],.20,.91], ['run',indexes(1,6),.40,[.84,.90,.79,.87,.81,.88]],
        ['pile',indexes(7,9),.24], ['run',indexes(10,13),.16,[.78,.86,.82,.89]]
      ];
      if (row === 0) return [
        ['run',indexes(0,4),.34,[.79,.88,.82,.91,.76]], ['cover',[5],.20,.92],
        ['run',indexes(6,10),.30,[.86,.80,.89,.77,.84]], ['cover',[11],.16,.84]
      ];
      return [
        ['run',indexes(0,3),.24,[.88,.81,.91,.79]], ['cover',[4],.20,.91],
        ['run',indexes(5,8),.25,[.84,.90,.78,.86]], ['cover',[9],.18,.87],
        ['run',indexes(10,12),.13,[.82,.89,.77]]
      ];
    }

    if (variant === 'balanced' && row === 0) return [
      ['run',indexes(0,13),1,[.79,.91,.86,.82,.88,.76,.84,.90,.81,.87,.78,.92,.83,.86]]
    ];
    if (variant === 'balanced') return [
      ['pile',indexes(0,2),.25], ['run',indexes(3,14),.75,[.83,.91,.86,.79,.88,.82,.76,.90,.84,.78,.87,.81]]
    ];
    if (variant === 'stacked' && row === 0) return [
      ['pile',indexes(0,2),.27], ['run',indexes(3,14),.73,[.83,.91,.78,.86,.81,.89,.76,.88,.82,.90,.79,.85]]
    ];
    if (variant === 'stacked') return [
      ['run',indexes(0,8),.58,[.80,.89,.84,.77,.91,.82,.87,.79,.86]],
      ['pile',indexes(9,11),.25], ['run',indexes(12,14),.17,[.88,.81,.85]]
    ];
    if (row === 0) return [
      ['run',indexes(0,8),.60,[.79,.90,.83,.88,.77,.86,.81,.92,.84]],
      ['pile',indexes(9,11),.24], ['run',indexes(12,14),.16,[.80,.89,.84]]
    ];
    return [
      ['pile',indexes(0,2),.24], ['run',indexes(3,8),.40,[.84,.91,.78,.87,.81,.89]],
      ['pile',indexes(9,11),.23], ['run',indexes(12,14),.13,[.79,.88,.83]]
    ];
  }

  function renderFramedRow(row, books, theme, variant, rowIndex, width, rowHeight) {
    composition(theme, variant, rowIndex).forEach(function (segment) {
      var segmentWidth = width * segment[2];
      if (segment[0] === 'run') uprightRun(row, books, segment[1], segmentWidth, rowHeight, segment[3]);
      if (segment[0] === 'pile') fittedPile(row, books, segment[1], segmentWidth, rowHeight);
      if (segment[0] === 'cover') row.appendChild(coverEl(bookAt(books, segment[1][0]), segmentWidth, rowHeight * segment[3]));
    });
  }

  function shelfMetrics(theme, width, height) {
    var metrics = [];
    if (theme === 'oak' || theme === 'builtin') {
      var inset = (theme === 'oak' ? .075 : .076) * width;
      var tops = theme === 'oak'
        ? [.034, .195, .351, .511, .670, .829]
        : [.041, .194, .342, .495, .645, .797];
      var baselines = theme === 'oak'
        ? [.181, .338, .496, .657, .815, .968]
        : [.174, .324, .477, .628, .780, .939];
      for (var framedRow = 0; framedRow < tops.length; framedRow++) {
        metrics.push({
          x: inset,
          y: tops[framedRow] * height,
          width: width - inset * 2,
          height: (baselines[framedRow] - tops[framedRow]) * height
        });
      }
      return metrics;
    }

    var inset = 5 * SCALE, rowHeight = height / 6;
    for (var row = 0; row < 6; row++) {
      metrics.push({x:inset, y:row * rowHeight, width:width - inset * 2, height:rowHeight});
    }
    return metrics;
  }

  var active = null;
  function wire(el, book) {
    function show() {
      if (active) active.classList.remove('is-active');
      el.classList.add('is-active');
      active = el;
      var text = book.title + (book.author ? ' — ' + book.author : '') + ' · ' + book.pages + ' pages';
      book.url = NOTES[book.title] || '';
      caption.textContent = text;
      if (book.url) {
        caption.appendChild(document.createTextNode(' · '));
        var a = document.createElement('a');
        a.href = book.url;
        a.textContent = 'notes →';
        caption.appendChild(a);
      }
    }
    el.addEventListener('click', show);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(); }
    });
  }

  var library = [];
  var manualSeed = null;

  function render() {
    if (!library.length) return;
    var width = shelf.clientWidth;
    if (width < 40) return;
    var height = shelf.clientHeight;
    SCALE = width / 350;
    shelf.innerHTML = '';
    active = null;

    var theme = shelf.getAttribute('data-theme') || 'classic';
    var seed = manualSeed !== null ? manualSeed : Math.floor(Date.now() / 3600000);
    var variant = LAYOUTS[((seed % LAYOUTS.length) + LAYOUTS.length) % LAYOUTS.length];
    shelf.setAttribute('data-layout', variant);
    var pool = shuffled(library, rngFrom(seed));
    var metrics = shelfMetrics(theme, width, height);
    var framed = theme === 'oak' || theme === 'builtin';
    var used = {};

    metrics.forEach(function (metric, r) {
      var row = document.createElement('div');
      row.className = 'shelf-row' + (framed ? ' is-framed' : '');
      row.style.left = metric.x + 'px';
      row.style.top = metric.y + 'px';
      row.style.width = metric.width + 'px';
      row.style.height = metric.height + 'px';

      var boardHeight = (framed ? 0 : 6) * SCALE;
      row.style.paddingBottom = boardHeight + 'px';

      if (framed) {
        var rowBooks = [];
        for (var n = 0; n < 16; n++) rowBooks.push(pool[(r * 16 + n) % pool.length]);
        renderFramedRow(row, rowBooks, theme, variant, r % 2, metric.width, metric.height);
      } else {
        var spineSpace = metric.height - boardHeight - 6 * SCALE;
        var available = pool.filter(function (book) { return !used[book.id]; });
        var capacity = available.reduce(function (sum, book) {
          return sum + spineWidth(book) + 1.5 * SCALE;
        }, 0);
        if (capacity < metric.width * 1.5) available = pool;
        var items = buildRow(available, metric.width, spineSpace, seed + r * 7919, variant);
        items.forEach(function (item) {
          if (item.kind === 'pile') {
            item.books.forEach(function (book) { used[book.id] = true; });
            row.appendChild(pileEl(item.books, spineSpace));
          } else {
            used[item.book.id] = true;
            row.appendChild(spineEl(item.book, spineSpace * heightFactor(item.book),
                                    item.kind === 'leaning'));
          }
        });

      }

      var board = document.createElement('div');
      board.className = 'board';
      board.style.height = boardHeight + 'px';
      row.appendChild(board);

      shelf.appendChild(row);
    });

    var layoutName = variant.charAt(0).toUpperCase() + variant.slice(1);
    caption.textContent = library.length + ' books on the list · ' + layoutName + ' layout · reshuffles every hour.';
  }

  // Theme choice sticks between visits, the way it does in the app.
  var themeBar = document.getElementById('themes');
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('shelfTheme'); } catch (e) {}
  if (savedTheme) applyTheme(savedTheme);

  function applyTheme(name) {
    if (!themeBar.querySelector('[data-theme="' + name + '"]')) return;
    shelf.setAttribute('data-theme', name);
    Array.prototype.forEach.call(themeBar.children, function (b) {
      b.classList.toggle('is-on', b.dataset.theme === name);
    });
    try { localStorage.setItem('shelfTheme', name); } catch (e) {}
    render();
  }

  themeBar.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) applyTheme(btn.dataset.theme);
  });

  shuffleBtn.addEventListener('click', function () {
    manualSeed = Math.floor(Math.random() * 2147483647);
    render();
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 150);
  });

  library = LIBRARY.filter(function (b) { return b.title && b.pages; });
  caption.textContent = library.length + ' books on the list. Reshuffles every hour.';
  render();
})();
</script>

  </body>
</html>
